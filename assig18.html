
<!DOCTYPE html>
<html lang="en">
<head>
    <title>ABC College Admission 2026</title>

    <style>
        body {
            font-family: Arial;
            margin: 0;
            background-color: #f2f2f2;
        }

        header {
            background-color: navy;
            color: white;
            text-align: center;
            padding: 15px;
        }

        main {
            background-color: white;
            width: 80%;
            max-width: 700px;
            margin: 20px auto;
            padding: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid gray;
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: #e0e0f0;
        }

        fieldset {
            margin-top: 15px;
        }

        input, select, textarea {
            margin: 5px 0;
        }

        footer {
            background-color: navy;
            color: white;
            text-align: center;
            padding: 10px;
        }
    </style>
</head>

<body>

    <header>
        <h1>ABC College Admission 2026</h1>
    </header>

    <main>

        <section>
            <h2>Courses and Fees</h2>

            <table>
                <caption>Available Courses</caption>

                <thead>
                    <tr>
                        <th>Course</th>
                        <th>Seats</th>
                        <th>Fees</th>
                    </tr>
                </thead>

                <tbody>
                    <tr>
                        <td>B.Tech CSE</td>
                        <td>120</td>
                        <td>₹90,000</td>
                    </tr>

                    <tr>
                        <td>BCA</td>
                        <td>60</td>
                        <td>₹45,000</td>
                    </tr>
                </tbody>
            </table>
        </section>

        <section>
            <form action="#" method="POST">

                <fieldset>
                    <legend>Application Form</legend>

                    <label for="name">Name:</label><br>
                    <input type="text" id="name"
                           name="name" required>
                    <br><br>

                    <label for="email">Email:</label><br>
                    <input type="email" id="email"
                           name="email" required>
                    <br><br>

                    <label for="course">Course:</label><br>

                    <select id="course" name="course">
                        <option>B.Tech CSE</option>
                        <option>BCA</option>
                    </select>

                    <br><br>

                    <label for="statement">Statement:</label><br>

                    <textarea id="statement"
                              name="statement"
                              rows="4" cols="40"></textarea>

                    <br><br>

                    <button type="submit">Apply</button>

                </fieldset>

            </form>
        </section>

    </main>

    <footer>
        &copy; 2026 ABC College
    </footer>

</body>
</html>
