
<!DOCTYPE html>
<html>
<head>
    <title>ShopEasy</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: white;
        }

        .container {
            border: 1px solid black;
            background-color: #f5f6fa;
            padding: 10px;
            height: 285px;
        }

        header {
            background-color: #222;
            color: white;
            text-align: center;
            padding: 10px;
            font-size: 20px;
            font-weight: bold;
        }

        .product {
            width: 255px;
            background-color: white;
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 8px;
            margin: 12px auto;
        }

        .product img {
            width: 100%;
            height: 130px;
            object-fit: contain;
            background-color: #eee;
            border: 1px solid #ddd;
        }

        .product h3 {
            font-size: 13px;
            margin: 5px 0;
        }

        .description {
            font-size: 10px;
            color: gray;
            margin: 5px 0;
        }

        .price {
            color: green;
            font-size: 12px;
            font-weight: bold;
        }

        .old-price {
            color: gray;
            font-size: 10px;
            text-decoration: line-through;
            margin-left: 5px;
        }

        button {
            width: 100%;
            background-color: #0666cc;
            color: white;
            border: none;
            padding: 7px;
            margin-top: 8px;
            cursor: pointer;
            border-radius: 3px;
        }

        button:hover {
            background-color: #004c99;
        }
    </style>
</head>

<body>

    <div class="container">

        <header>ShopEasy</header>

        <div class="product">

            <img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=400"
                 alt="Green Cotton T-Shirt">

            <h3>Classic Cotton T-Shirt</h3>

            <p class="description">
                Soft, breathable cotton. Regular fit.
                Available in multiple colors.
            </p>

            <span class="price">₹799</span>

            <span class="old-price">₹1,199</span>

            <button>Add to Cart</button>

        </div>

    </div>

</body>
</html>
