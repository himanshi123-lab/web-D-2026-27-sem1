
<!DOCTYPE html>
<html>
<head>
    <title>Nested and Responsive Table</title>

    <style>
        .table-container {
            width: 100%;
            overflow-x: auto;
        }
    </style>
</head>
<body>

    <div class="table-container">

        <table border="1" cellpadding="8">

            <tr>
                <th>Day</th>
                <th>Lab Batches</th>
                <th>Faculty</th>
                <th>Room</th>
                <th>Time</th>
            </tr>

            <tr>
                <td>Friday</td>

                <td>
                    <table border="1" cellpadding="5">
                        <tr>
                            <th>Batch</th>
                            <th>System</th>
                        </tr>

                        <tr>
                            <td>A1</td>
                            <td>PC 1-20</td>
                        </tr>

                        <tr>
                            <td>A2</td>
                            <td>PC 21-40</td>
                        </tr>
                    </table>
                </td>

                <td>Dr. Sharma</td>
                <td>Lab 2</td>
                <td>2-4 PM</td>
            </tr>

        </table>

    </div>

</body>
</html>
