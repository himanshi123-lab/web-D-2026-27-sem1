<!DOCTYPE html>
<html>
<head>
    <title>Media Web Page</title>
</head>

<body>

    <a href="https://www.bbc.com">Read more on BBC</a>

    <h2>Sports Update</h2>
    <p>Highlights of yesterday's football match with thrilling last-minute goals!</p>

    <iframe width="600" height="340"
        src="https://www.youtube.com/embed/aqz-KE-bpKQ"
        allowfullscreen>
    </iframe>

    <hr>

    <h2>Entertainment Buzz</h2>
    <p>New movie trailer released today. Fans are excited!</p>

    <video width="600" height="340" controls>
        <source src="movie.mp4" type="video/mp4">
    </video>

    <hr>

    <h2>News Podcast</h2>
    <p>Listen to today's top headlines.</p>

    <audio controls>
        <source src="news.mp3" type="audio/mpeg">
    </audio>

</body>
</html>
