
<!DOCTYPE html>
<html>

        ul {
            list-style-type: none;
            background-color: #333;
            padding: 15px;
            display: flex;
        }

        li {
            margin-right: 30px;
        }

        a {
            color: white;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <nav>
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Courses</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>

</body>
</html>
